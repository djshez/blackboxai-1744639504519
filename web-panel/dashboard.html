<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trax-6A GPS Tracker - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        #map {
            height: calc(100vh - 4rem);
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <i class="fas fa-satellite-dish text-2xl text-blue-600 mr-2"></i>
                        <span class="font-bold text-xl">Trax-6A GPS</span>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="dashboard.html" class="border-b-2 border-blue-500 text-gray-900 inline-flex items-center px-1 pt-1 text-sm font-medium">
                            Dashboard
                        </a>
                        <a href="history.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            History
                        </a>
                        <a href="shutdown.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Remote Shutdown
                        </a>
                        <a href="settings.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Settings
                        </a>
                    </div>
                </div>
                <div class="flex items-center">
                    <button id="logout" class="text-gray-500 hover:text-gray-700">
                        <i class="fas fa-sign-out-alt mr-2"></i>
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="flex h-[calc(100vh-4rem)]">
        <!-- Sidebar -->
        <div class="w-64 bg-white shadow-lg">
            <div class="p-4">
                <h2 class="text-lg font-semibold text-gray-700 mb-4">Active Devices</h2>
                <div id="deviceList" class="space-y-3">
                    <!-- Device list will be populated dynamically -->
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1">
            <div id="map"></div>
        </div>
    </div>

    <script>
        let map;
        let markers = {};
        let deviceUpdateInterval;

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 0, lng: 0 },
                zoom: 2,
                styles: [
                    {
                        featureType: "poi",
                        elementType: "labels",
                        stylers: [{ visibility: "off" }]
                    }
                ]
            });
        }

        async function fetchDevices() {
            try {
                const response = await fetch('/api/devices', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                
                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/index.html';
                        return;
                    }
                    throw new Error('Failed to fetch devices');
                }
                
                const devices = await response.json();
                updateDeviceList(devices);
            } catch (error) {
                console.error('Error fetching devices:', error);
            }
        }

        function updateDeviceList(devices) {
            const deviceList = document.getElementById('deviceList');
            deviceList.innerHTML = '';

            devices.forEach(device => {
                const deviceElement = document.createElement('div');
                deviceElement.className = 'p-3 bg-gray-50 rounded-lg hover:bg-gray-100 cursor-pointer transition-colors duration-200';
                deviceElement.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="font-medium text-gray-900">${device.imei}</h3>
                            <p class="text-sm text-gray-500">Last seen: ${new Date(device.lastSeen).toLocaleString()}</p>
                            <p class="text-sm text-gray-500">Speed: ${device.speed || 0} km/h</p>
                        </div>
                        <div class="flex items-center">
                            <span class="h-2 w-2 rounded-full ${device.online ? 'bg-green-500' : 'bg-red-500'} mr-2"></span>
                        </div>
                    </div>
                `;
                
                deviceElement.addEventListener('click', () => {
                    if (markers[device.imei]) {
                        map.panTo(markers[device.imei].getPosition());
                        map.setZoom(15);
                    }
                });
                
                deviceList.appendChild(deviceElement);
                updateMarker(device);
            });
        }

        function updateMarker(device) {
            const position = {
                lat: device.latitude,
                lng: device.longitude
            };

            if (markers[device.imei]) {
                markers[device.imei].setPosition(position);
            } else {
                markers[device.imei] = new google.maps.Marker({
                    position: position,
                    map: map,
                    title: `Device: ${device.imei}`,
                    icon: {
                        path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
                        scale: 6,
                        fillColor: '#2563EB',
                        fillOpacity: 1,
                        strokeWeight: 2,
                        rotation: device.heading || 0
                    }
                });

                // Add click listener to marker
                markers[device.imei].addListener('click', () => {
                    const infoWindow = new google.maps.InfoWindow({
                        content: `
                            <div class="p-2">
                                <h3 class="font-bold">Device: ${device.imei}</h3>
                                <p>Speed: ${device.speed || 0} km/h</p>
                                <p>Last Updated: ${new Date(device.lastSeen).toLocaleString()}</p>
                                <button onclick="sendShutdownCommand('${device.imei}')" 
                                        class="mt-2 px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600">
                                    Shutdown
                                </button>
                            </div>
                        `
                    });
                    infoWindow.open(map, markers[device.imei]);
                });
            }
        }

        async function sendShutdownCommand(imei) {
            if (!confirm(`Are you sure you want to shutdown device ${imei}?`)) {
                return;
            }

            try {
                const response = await fetch('/api/shutdown', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ imei })
                });

                if (!response.ok) {
                    throw new Error('Failed to send shutdown command');
                }

                alert('Shutdown command sent successfully');
            } catch (error) {
                console.error('Error sending shutdown command:', error);
                alert('Failed to send shutdown command');
            }
        }

        // Initialize map and start polling for updates
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            fetchDevices();
            deviceUpdateInterval = setInterval(fetchDevices, 5000);

            // Setup logout handler
            document.getElementById('logout').addEventListener('click', () => {
                localStorage.removeItem('token');
                window.location.href = '/index.html';
            });
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (deviceUpdateInterval) {
                clearInterval(deviceUpdateInterval);
            }
        });
    </script>
</body>
</html>
